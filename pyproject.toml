[project]
name = "voicetest"
version = "0.2.0"
description = "Voice model comparison lab (browser) + optional ClawOps Trial phone path"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
clawops = [
  "clawops[agent,openai]>=0.56,<0.57",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
